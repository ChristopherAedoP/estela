name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Servidor (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El proyecto solo se habia ejecutado en el equipo del autor. La matriz
        # existe para detectar lo que dependa de una plataforma concreta.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar torch (ruedas de CPU)
        # Las ruedas por defecto arrastran CUDA (~2,5 GB) y aqui no hay GPU.
        run: >
          python -m pip install torch==2.6.0 torchaudio==2.6.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar el servidor
        # Sin el extra [gpu] a proposito: comprueba que la instalacion funciona
        # en una maquina sin NVIDIA, que es el caso que antes fallaba.
        working-directory: server
        run: python -m pip install ".[dev]"

      - name: Tests
        working-directory: server
        run: python -m pytest tests -q

  client:
    name: Cliente (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        working-directory: client-py
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        working-directory: client-py
        run: python -m pytest tests -q

  imagen-docker:
    name: La imagen del servidor construye
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo se comprueba que la imagen construye. Ejercitar la GPU necesitaria
      # un runner con NVIDIA Container Toolkit, que GitHub no ofrece.
      - name: Construir
        run: docker build -t estela/actas-server:ci ./server

      - name: El servidor arranca y responde
        run: |
          docker run -d --name estela-ci -p 8770:8770 estela/actas-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8770/health; then echo; exit 0; fi
            sleep 2
          done
          echo "El servidor no respondio a tiempo"
          docker logs estela-ci
          exit 1

      - name: Recoger
        if: always()
        run: docker rm -f estela-ci || true
